version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: arbiradar-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: arbiradar
    volumes:
      - mongodb_data:/data/db
    networks:
      - arbiradar-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbiradar-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/arbiradar
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
    depends_on:
      - mongodb
    networks:
      - arbiradar-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  arbiradar-network:
    driver: bridge